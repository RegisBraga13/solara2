services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medconsult-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medconsult}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medconsult}
      POSTGRES_DB: ${POSTGRES_DB:-medconsult}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medconsult}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medconsult-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Armazenamento de objetos compativel com S3 (substitui o MinIO, que deixou de distribuir
  # imagens em out/2025 e foi arquivado em 2026). As credenciais ficam em infra/seaweedfs/s3.json
  # e precisam bater com S3_ACCESS_KEY / S3_SECRET_KEY do .env.
  storage:
    image: chrislusf/seaweedfs:latest
    container_name: medconsult-storage
    restart: unless-stopped
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storage_data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Opcional: backend e frontend em containers (docker compose --profile app up -d) ---
  backend:
    profiles: ["app"]
    build: ./backend
    container_name: medconsult-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medconsult}:${POSTGRES_PASSWORD:-medconsult}@postgres:5432/${POSTGRES_DB:-medconsult}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: storage:8333
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build: ./frontend
    container_name: medconsult-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  storage_data:
