[project]
name = "medconsult-backend"
version = "0.1.0"
description = "espec·IA·lidades backend (FastAPI)"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pasta temporária própria do projeto: não depende do %TEMP% do sistema (que pode estar bloqueado).
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
